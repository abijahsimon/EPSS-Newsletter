<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="/covers-data.js?v=20260914"></script>
<script src="/doc-page.js"></script>
<style>
  doc-page:not(:defined) { visibility: hidden; }
  body { margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
</style>
</helmet>

<doc-page width="24in" height="36in">
  <section class="page" style="display:flex;flex-direction:column;padding:0.7in;background:#060b12;color:#fbfaf7">

    <header style="flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:0.6in;padding-bottom:0.16in;border-bottom:3px solid #ffd100">
      <div style="min-width:0">
        <p style="margin:0 0 0.16in;font-family:'IBM Plex Mono',monospace;font-size:14pt;font-weight:500;letter-spacing:0.3em;text-transform:uppercase;color:#ffd100">UCLA Earth, Planetary &amp; Space Sciences</p>
        <h1 style="margin:0;font-family:Newsreader,Georgia,serif;font-weight:300;font-size:104pt;line-height:0.94;letter-spacing:-0.03em;white-space:nowrap">EPSS Through Deep&nbsp;Time</h1>
      </div>
      <p style="flex:0 0 auto;margin:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.5pt;line-height:1.55;letter-spacing:0.06em;color:rgba(251,250,247,0.72)">595 Charles E. Young Drive East<br />Los Angeles, CA 90095<br /><span style="color:#ffd100">epss.ucla.edu</span></p>
    </header>

    <p style="flex:0 0 auto;display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:baseline;gap:0.24in;margin:0;padding:0.26in 0 0.24in;font-family:Newsreader,Georgia,serif;font-weight:300;font-size:21pt;line-height:1.2;color:rgba(251,250,247,0.82);white-space:nowrap">
      <span>Forty-eight print newsletters, 1967 to 2025, and the first online issue</span>
      <span aria-hidden="true" style="flex:1 1 auto;height:1px;background:rgba(251,250,247,0.28)"></span>
      <span>Geology</span>
      <span aria-hidden="true" style="color:#ffd100">→</span>
      <span>Earth &amp; Space Sciences</span>
      <span aria-hidden="true" style="color:#ffd100">→</span>
      <span>Earth, Planetary &amp; Space Sciences</span>
    </p>

    <div style="flex:1 1 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;gap:0.16in 0.14in;min-height:0">
      <figure style="position:relative;margin:0;min-width:0;min-height:0;display:flex;flex-direction:column;padding:0.16in 0.14in 0.12in;background:linear-gradient(160deg,#12203a 0%,#060b12 62%);border:1.5px solid #ffd100;overflow:hidden">
        <span aria-hidden="true" style="position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 22% 18%,rgba(251,250,247,0.85),transparent 60%),radial-gradient(1.1px 1.1px at 68% 12%,rgba(251,250,247,0.6),transparent 60%),radial-gradient(1.6px 1.6px at 44% 34%,rgba(251,250,247,0.7),transparent 60%),radial-gradient(1.2px 1.2px at 80% 44%,rgba(251,250,247,0.55),transparent 60%),radial-gradient(1.3px 1.3px at 16% 52%,rgba(251,250,247,0.5),transparent 60%)"></span>
        <span aria-hidden="true" style="position:absolute;left:-38%;bottom:-30%;width:150%;aspect-ratio:1/1;border-radius:999px;background:radial-gradient(circle at 62% 26%,rgba(39,116,174,0.55) 0%,rgba(16,24,32,0.85) 58%,rgba(6,11,18,0) 70%)"></span>
        <img src="/assets/images/2026/archive/online-issue-screenshot.png" alt="Placeholder screenshot of the 2026 EPSS annual newsletter website." style="position:absolute;left:0.1in;top:0.1in;width:calc(100% - 0.2in);height:auto;max-width:100%;border:1px solid rgba(255,209,0,0.55)" />
        <span aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,11,18,0.97) 0%,rgba(6,11,18,0.9) 42%,rgba(6,11,18,0.55) 66%,rgba(6,11,18,0.2) 100%)"></span>
        <p style="position:relative;margin:auto 0 0.06in;font-family:'IBM Plex Mono',monospace;font-size:9.5pt;font-weight:600;line-height:1.4;letter-spacing:0.16em;text-transform:uppercase;color:#ffd100">First online issue</p>
        <p style="position:relative;margin:0;font-family:Newsreader,Georgia,serif;font-weight:300;font-size:44pt;line-height:0.9;letter-spacing:-0.03em;color:#fbfaf7">2026</p>
      </figure>
      <sc-if value="{{ hasCovers }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ covers }}" as="cover" hint-placeholder-count="0">
          <figure style="position:relative;margin:0;min-width:0;min-height:0">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-cover="{{ cover.src }}" alt="{{ cover.alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain" />
            <figcaption style="position:absolute;left:0;right:0;bottom:0;padding:0.3in 0.06in 0.05in;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13pt;font-weight:600;letter-spacing:0.06em;color:#ffd100;background:linear-gradient(0deg,rgba(6,11,18,0.92) 0%,rgba(6,11,18,0.6) 55%,rgba(6,11,18,0) 100%)">{{ cover.label }}</figcaption>
          </figure>
        </sc-for>
      </sc-if>
    </div>

  </section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // The real path is carried in data-cover, not src: a {{ }} hole inside src
  // is fetched literally by the browser's preload scanner while the template
  // is still streaming, which logs a failed request on every load.
  hydrateCovers = () => {
    document.querySelectorAll("img[data-cover]").forEach((img) => {
      const want = img.getAttribute("data-cover");
      if (want && !want.includes("{{") && !img.src.endsWith(want)) img.src = want;
    });
  };

  componentDidMount() { this.hydrateCovers(); }
  componentDidUpdate() { this.hydrateCovers(); }

  renderVals() {
    const source = (typeof window !== "undefined" && window.EPSS_COVERS) || [];
    return {
      hasCovers: source.length > 0,
      covers: source.map((c) => ({ ...c, alt: `Cover of the ${c.label} EPSS newsletter.` })),
    };
  }
}
</script>
</body>
</html>
