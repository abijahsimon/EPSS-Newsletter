name: Validate newsletter builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            base: /
          - name: subpath
            base: /newsletter
    env:
      NEWSLETTER_BASE: ${{ matrix.base }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro sources
        run: pnpm check
      - name: Test path rewriting
        run: pnpm test:paths
      - name: Build static site
        run: pnpm build
      - name: Verify built links and fragments
        run: pnpm verify:links
      - name: Upload static build for hosting review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: newsletter-static-${{ matrix.name }}
          path: app/dist/
          retention-days: 7
          if-no-files-found: error
