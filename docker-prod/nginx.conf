server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prefer exact files; serve directory indexes; preserve trailing-slash routes
    # used by the Astro static export.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
