# Newsletter static site on epssdocker03 (faculty WordPress host, 128.97.5.81).
#
# Primary edge: faculty-web Apache (container faculty-web-1) on network
# NEWSLETTER_PROXY_NETWORK (default faculty_default), same pattern as print.
# Newsletter joins that network with alias `newsletter` so the vhost can
# ProxyPass to http://newsletter:8080/.
#
# Also published on 127.0.0.1:NEWSLETTER_HOST_PORT for local smoke tests.
#
# Optional profile `traefik`: Traefik v3.5 on the internal `web` network only
# (reaches newsletter as http://newsletter:8080). Do not enable on epssdocker03
# while faculty-web owns :80/:443. The external faculty network is still
# required by default — create it or set NEWSLETTER_PROXY_NETWORK if testing
# Traefik elsewhere (see DEPLOY.md).

name: newsletter

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-security: &security
  security_opt:
    - no-new-privileges:true

services:
  newsletter:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${NEWSLETTER_IMAGE:-newsletter:prod}
    <<: [*restart, *logging, *security]
    ports:
      # Loopback smoke / Host-header tests (faculty-web uses Docker DNS, not this).
      - "127.0.0.1:${NEWSLETTER_HOST_PORT:-8088}:8080"
    networks:
      web:
      proxy:
        aliases:
          - newsletter
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional / non-default on epssdocker03. File provider + CertiNext PEMs.
  # Talks to newsletter over `web` only; does not use the faculty proxy network.
  traefik:
    profiles: ["traefik"]
    image: traefik:v3.5
    <<: [*restart, *logging, *security]
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - web
    depends_on:
      - newsletter
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web:
    driver: bridge
  # Faculty compose bridge (faculty-web-1 + print, etc.). Must already exist.
  proxy:
    external: true
    name: ${NEWSLETTER_PROXY_NETWORK:-faculty_default}
