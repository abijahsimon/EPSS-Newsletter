# faculty-web Apache vhost — same pattern as print.epss.ucla.edu.conf.
# Install on epssdocker03:
#   sudo cp docker-prod/host/apache-faculty-web/newsletter.epss.ucla.edu.conf \
#     /opt/faculty/apache/sites-enabled/
#   docker exec faculty-web-1 apachectl configtest
#   docker exec faculty-web-1 apachectl graceful
#
# Upstream is the newsletter container on Docker network faculty_default
# (alias `newsletter`). CertiNext lineage dir uses the `.cert` suffix.

<VirtualHost *:80>
    ServerName newsletter.epss.ucla.edu
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName newsletter.epss.ucla.edu

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/newsletter.epss.ucla.edu.cert/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/newsletter.epss.ucla.edu.cert/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://newsletter:8080/
    ProxyPassReverse / http://newsletter:8080/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
