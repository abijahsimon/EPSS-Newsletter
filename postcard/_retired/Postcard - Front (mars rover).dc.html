<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #55606b; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>

<!-- ============================================================
     EPSS NEWSLETTER REBRAND POSTCARD — SIDE A, BAND LAYOUT
     Artboard 9.25 x 6.25 in  =  6 x 9 in trim + 0.125 in bleed
       Trim edge    0.125 in inset from artboard edge
       Safe margin  0.375 in inset

     LAYOUT: wide photograph bleeding across the top 3.8 in, gold
     hairline, then an ink type field beneath. Use this layout for
     LANDSCAPE photographs (16:9 group shots, wide vistas). The
     tall-right-panel layout is for PORTRAIT files — a wide group
     photo cropped into a vertical panel loses the group.

     Band geometry: 9.25 x 3.8 in = 2.434:1. A 16:9 source keeps
     73% of its height, so object-position tunes which 73%.

     No QR on this side by design — Side A earns the turn-over.
     ============================================================ -->

<div style="position:relative;width:9.25in;height:6.25in;overflow:hidden;background:#101820;display:flex;flex-direction:column;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif">

  <!-- ============ PHOTO BAND — bleeds off top, left, right ============ -->
  <div style="height:3.8in;flex:0 0 auto;position:relative;overflow:hidden">
    <img src="assets/images/mars-rover-perseverance.png"
         alt="The Perseverance rover on the surface of Mars."
         style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%">
    <!-- gold hairline: the issue's accent, holding the seam -->
    <div style="position:absolute;left:0;right:0;bottom:0;height:1.2pt;background:#ffd100"></div>
  </div>

  <!-- ============ TYPE FIELD ============ -->
  <div style="flex:1;display:flex;flex-direction:column;padding:0.26in 0.5in 0.46in">

    <!-- masthead left · issue line right -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:24pt">
      <div>
        <img src="assets/brand/epss-lockup-white.svg"
             alt="UCLA College Physical Sciences — Earth, Planetary &amp; Space Sciences"
             style="width:2.4in">
        <div style="margin-top:5pt;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:10.5pt;letter-spacing:0.185em;color:#fbfaf7">NEWSLETTER</div>
      </div>
      <div style="display:flex;align-items:center;gap:8pt;padding-top:3pt;font-family:'IBM Plex Mono',monospace;font-size:6.8pt;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#ffd100;white-space:nowrap">
        <span>2025&ndash;2026</span>
        <span style="width:16pt;height:0.6pt;background:rgba(255,209,0,0.6)"></span>
        <span>Published September 2026</span>
      </div>
    </div>

    <h1 style="margin:13pt 0 0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:38pt;line-height:1.0;letter-spacing:-0.022em;color:#fbfaf7;white-space:nowrap">Our newsletter has a new home.</h1>

    <!-- inside-this-issue as one line · turn-over cue right -->
    <div style="margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:20pt">
      <div style="font-family:Newsreader,Georgia,serif;font-weight:300;font-size:10pt;line-height:1.3;color:rgba(251,250,247,0.8)">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:6.5pt;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:rgba(251,250,247,0.5)">Inside</span>
        <span style="color:#ffd100;padding:0 5pt">&mdash;</span>Radar reveals Mars&rsquo; lost rivers
        <span style="color:#ffd100;padding:0 5pt">&middot;</span>Three new endowed chairs
        <span style="color:#ffd100;padding:0 5pt">&middot;</span>Celebrating the Class of 2026
      </div>
      <div style="display:flex;align-items:center;gap:8pt;font-family:'IBM Plex Mono',monospace;font-size:6.8pt;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#ffd100;white-space:nowrap">
        <span>Please turn over</span>
        <span style="width:22pt;height:0.6pt;background:#ffd100"></span>
      </div>
    </div>

  </div>
</div>

</x-dc>
</body>
</html>
